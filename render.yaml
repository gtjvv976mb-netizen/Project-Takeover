# Render blueprint for Project: Takeover.
#
# The service runs on a paid instance because it keeps a SQLite file, and Render only
# offers persistent disks on paid plans. The database holds descriptions, images and
# builder profiles; money and ownership live on chain, so losing this disk would cost
# presentation, never funds.
services:
  - type: web
    name: project-takeover
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    # SQLite needs a single writer on one machine, so this service must never scale out.
    numInstances: 1

    # A consequence worth knowing before you panic at a 502: a service with a disk cannot
    # deploy with zero downtime. Render can only attach the disk to one instance, so the
    # old one must fully stop before the new one starts, and every deploy costs roughly a
    # minute or two of 502s. That is normal here. Ten deploys in an hour looks exactly like
    # a crash loop from outside, and once did.

    disk:
      name: takeover-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # node:sqlite is a built-in from Node 22.13 onward.
      - key: NODE_VERSION
        value: "24"
      - key: DB_PATH
        value: /var/data/takeover.db
      - key: SOLANA_NETWORK
        value: devnet
      - key: FEE_BPS
        value: "500"
      # A concrete default, deliberately. `sync: false` here is the correct pattern for a
      # secret and it is what I reached for first, but Render refuses to deploy a service
      # with a `sync: false` variable that has no dashboard value, and the site went into a
      # 502 loop until this was put back.
      #
      # To use a paid endpoint, set RPC_URL in the Render dashboard. A value set there wins
      # for an existing service; this line only supplies the default on a fresh blueprint.
      # Never put a keyed URL on this line — the file is public.
      - key: RPC_URL
        value: https://api.devnet.solana.com
      # Baked into the browser bundle at build time, so it must be set before the build —
      # and readable by anyone who views source. Only put a keyed endpoint here if that key
      # is domain-restricted at the provider; otherwise strangers spend your quota.
      - key: NEXT_PUBLIC_RPC_URL
        value: https://api.devnet.solana.com
      - key: NEXT_PUBLIC_APP_NAME
        value: "Project: Takeover"
      # Absolute base for canonical and Open Graph URLs. A link preview needs a full URL,
      # so this must match whatever domain the site is actually served from.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://project-takeover.com
      # Fallback only. The live treasury is read from the program's own config account, so
      # rotating it on chain is enough and this value is used only before `initialize` has
      # ever run. Public either way — the server never signs for it.
      - key: TREASURY_PUBKEY
        value: DwjNBeS7KtXCqBhZBwMK6vEReW2fpgc3pU2WKzqfGgoV
